<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="grid-container">
        <div id="grid-1" class="grid-square"></div>
        <div id="grid-2" class="grid-square"></div>
        <div id="grid-3" class="grid-square"></div>
        <div id="grid-4" class="grid-square"></div>
        <div id="grid-5" class="grid-square"></div>
        <div id="grid-6" class="grid-square"></div>
        <div id="grid-7" class="grid-square"></div>
        <div id="grid-8" class="grid-square"></div>
        <div id="grid-9" class="grid-square"></div>
    </div>
    <div id="player-1-txt">Player 1:</div>
    <div id="player-2-txt">Player 2:</div>
    <button id="start-game">Start Game</button>
    <script src="titctac_functions.js"></script>
</body>
</html>
